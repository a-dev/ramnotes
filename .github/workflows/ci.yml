name: Build checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  builds:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 27
        shell: bash
        run: |
          set -euo pipefail
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode_27*.app' | sort -V | tail -n 1)"
          test -n "$xcode" || { echo '::error::Xcode 27 is required'; exit 1; }
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
      - name: Check string catalogs
        run: bash scripts/check-localizations.sh
      - name: Build both channels and test domain rules
        run: bash scripts/check-builds.sh
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: build/CI/Logs
          retention-days: 7
